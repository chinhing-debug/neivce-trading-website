<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>NEIVCE Admin Panel</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" /><link rel="stylesheet" href="styles.css" /></head>
<body class="admin-body"><header class="admin-header"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>NEIVCE <span class="muted">Admin</span></span></a><a href="index.html">← View website</a></header>
<main class="admin-main"><section id="loginScreen" class="login-card"><p class="eyebrow">Staff access</p><h1>Welcome back.</h1><p>Sign in to update selected website content.</p><form id="loginForm"><label>Access password<input type="password" id="password" required placeholder="Enter password" /></label><button class="button primary" type="submit">Sign in</button><p id="loginMessage" aria-live="polite"></p></form><small>Demo password: <strong>neivce2026</strong></small></section>
<section id="dashboard" hidden><div class="dashboard-title"><div><p class="eyebrow">Content dashboard</p><h1>Website content</h1><p>Update the fields below, then save to publish them on this browser.</p></div><button id="logout" class="text-button">Log out</button></div><form id="contentForm" class="content-form"><label>Company introduction<textarea id="introInput" rows="3"></textarea></label><label>Homepage announcement<textarea id="announcementInput" rows="2"></textarea></label><div class="form-grid"><label>E-commerce description<textarea id="ecommerceInput" rows="4"></textarea></label><label>Programming description<textarea id="programmingInput" rows="4"></textarea></label><label>Training description<textarea id="trainingInput" rows="4"></textarea></label></div><div class="form-grid contact-grid"><label>Company address<textarea id="addressInput" rows="3"></textarea></label><label>Telephone number<input id="telephoneInput" /></label></div><div class="save-row"><button class="button primary" type="submit">Save and publish</button><button id="resetContent" class="button secondary" type="button">Restore defaults</button><p id="saveMessage" aria-live="polite"></p></div></form></section></main><script src="app.js"></script></body></html>
